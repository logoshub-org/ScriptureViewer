# Skip configuration for the ScriptureViewer module: on Android the viewer is the Compose one (plan D185); the SwiftUI wrapper is in
# ScriptureViewerSkipUI, so this module needs no SkipUI.
# The Kotlin files in this folder are links to ../../../Android/scriptureviewer/src/main/kotlin/scripture/viewer/compose: one copy of
# the viewer, built here into the module and there into the Android library and its tests.
skip:
  mode: 'transpiled'

build:
  contents:
    # the Compose compiler, for the viewer's composable (SkipUI applied it before)
    - block: 'plugins'
      contents:
        - 'alias(libs.plugins.kotlin.compose)'
    - block: 'dependencies'
      contents:
        # the viewer's scroll view
        - 'implementation("androidx.core:core:1.18.0")'
        # Compose for the viewer's composable (AndroidView), which SkipUI brought before the SwiftUI wrapper moved to ScriptureViewerSkipUI
        - 'implementation(platform("androidx.compose:compose-bom:2026.05.01"))'
        - 'implementation("androidx.compose.ui:ui")'
