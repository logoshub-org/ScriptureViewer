name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  portable:
    name: Tests on macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - name: swift test
        run: swift test

  ios:
    name: Viewer for iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - name: Build the ScriptureViewer scheme for the simulator
        run: xcodebuild -scheme ScriptureViewer -destination 'generic/platform=iOS Simulator' build

  linux:
    name: Tests on Linux
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        run: swift test
