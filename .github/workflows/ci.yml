name: CI

on:
  push:
    branches: [main]
  pull_request:

# The two platforms the package is for: iOS, and Android through Skip.
jobs:
  ios:
    name: Tests on iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      # Every test target of the package, on an iPhone simulator (the first one the runner has), and the viewer built for iOS on the way.
      # The package is a Skip package: Xcode asks for its build plugin to be trusted before it runs it, and on CI that is the flag.
      - name: Tests on the iOS simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json, sys
          devices = json.load(sys.stdin)['devices']
          print(next(d['udid'] for runtime, list in devices.items() if 'iOS' in runtime for d in list if d['name'].startswith('iPhone')))")
          xcodebuild test -scheme ScriptureViewer-Package -destination "id=$DEVICE" -skipPackagePluginValidation

  android:
    name: Tests on Android
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"   # Robolectric needs Java 21 for Android SDK 36 (the Kotlin tests run on it)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.9.1"   # the version the Kotlin tests were run with locally
      - name: Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      # The Kotlin parity tests (Transpile/README.md): each test target runs as Swift and, through Skip, as Kotlin on an Android
      # runtime on the JVM; the Kotlin results must match the Swift ones. (The viewer's instrumented tests need an emulator, which
      # these runners cannot run: they are the next job, on Linux.)
      - name: Kotlin parity tests
        working-directory: Transpile
        run: swift test

  android-emulator:
    name: Viewer on an Android emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Android project takes the core's Kotlin from what Skip writes when the package is built: only the core's targets, which
      # build on Linux (the viewer target's iOS side needs UIKit). The runner's own Swift; Skip's build tool has a Linux version.
      - name: Transpile the core to Kotlin
        run: |
          swift --version
          swift build --target ScriptureTextSource
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"   # Robolectric needs Java 21 for Android SDK 36 (the Kotlin tests run on it)
      - name: Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The viewer's instrumented tests (Android/scriptureviewer/src/androidTest): Psalm 119 on a real Android, scrolled, tapped,
      # selected, highlighted, sized, read by accessibility.
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: Android
          # The screen unlocked and no system dialog in front ("System UI isn't responding" on a slow boot), so the test's window
          # has focus: the long press goes through the whole screen. hide_error_dialogs: a system app that stalls later on the shared
          # runner ("Pixel Launcher isn't responding") puts no dialog over the test's window.
          script: |
            adb shell settings put global hide_error_dialogs 1
            adb shell input keyevent 82
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS
            ./gradlew --no-daemon :scriptureviewer:connectedDebugAndroidTest
      # When a test fails: its name and message in this log, and the whole report (index.html, and the raw results) as an artifact
      # on the run's page. The report's file:// path in Gradle's message is on the runner, which is gone by then.
      - name: Failing tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, html, re
          for path in glob.glob("Android/scriptureviewer/build/outputs/androidTest-results/connected/**/*.xml", recursive=True):
              text = open(path, encoding="utf-8").read()
              for case in re.finditer(r'<testcase name="([^"]+)" classname="([^"]+)"[^>]*>\s*<failure[^>]*>(.*?)</failure>', text, re.S):
                  print("FAILED", case.group(2) + "." + case.group(1))
                  print(html.unescape(case.group(3)).strip()[:3000])
                  print()
          PY
      - name: Upload Android test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: |
            Android/scriptureviewer/build/reports/androidTests/connected/
            Android/scriptureviewer/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
